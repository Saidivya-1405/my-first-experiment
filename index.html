<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Web Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: greeen;
            text-align: center;
            padding: 40px;
        }
        h1 {
            color: #333;
        }
        p {
            font-size: 18px;
            color: white;
        }
        button {
            padding: 15px 20px;
            font-size: 16px;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: coral;
        }
    </style>
</head>
<body>
    <h1>Hello, GitHub!</h1>
    <p>This is a sample HTML page with styling and a button.</p>
    <button onclick="alert('Thanks for clicking!')">Click Me</button>
</body>
</html>
